<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QyrexObf — Elite Lua Obfuscator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#07070c;color:#e4e4ed;margin:0;min-height:100vh}
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0}
  body::before{width:480px;height:480px;top:-160px;left:-100px;background:rgba(124,58,237,.28)}
  body::after{width:420px;height:420px;bottom:-160px;right:-100px;background:rgba(88,101,242,.18)}
  .wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:32px 20px 60px}
  .card{background:rgba(17,17,24,.85);border:1px solid #1c1c28;border-radius:18px;backdrop-filter:blur(14px)}
  textarea{width:100%;min-height:220px;background:#0c0c12;border:1px solid #252533;border-radius:12px;color:#e4e4ed;padding:14px;font-family:ui-monospace,monospace;font-size:12.5px;resize:vertical}
  select,button{border-radius:10px;font-weight:600;font-size:14px}
  select{background:#0c0c12;border:1px solid #252533;color:#e4e4ed;padding:10px 14px}
  .btn{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:none;padding:12px 22px;cursor:pointer;box-shadow:0 8px 28px -8px rgba(124,58,237,.55)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:transparent;border:1px solid #2a2a3a;color:#a0a0b0;padding:10px 16px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="flex items-center gap-3 mb-8">
    <div class="w-10 h-10 rounded-xl" style="background:linear-gradient(135deg,#7c3aed,#4c1d95)"></div>
    <div>
      <div class="text-xl font-bold tracking-tight">QyrexObf</div>
      <div class="text-xs" style="color:#6b6b80">Multi-layer Lua protection · Anti-tamper · XOR VM</div>
    </div>
  </div>

  <div class="card p-6 mb-4">
    <label class="text-xs font-semibold mb-2 block" style="color:#8b8b9e">Código Lua / Luau</label>
    <textarea id="src" placeholder="pega tu script aquí..."></textarea>
    <div class="flex flex-wrap gap-3 mt-4 items-center">
      <select id="preset">
        <option value="light">Light (rápido)</option>
        <option value="normal" selected>Normal (recomendado)</option>
        <option value="heavy">Heavy</option>
        <option value="maximum">Maximum</option>
      </select>
      <label class="text-sm flex items-center gap-2" style="color:#8b8b9e">
        <input type="checkbox" id="anti" checked/> Anti-tamper / anti-sandbox
      </label>
      <button class="btn" id="go" onclick="run()">Ofuscar</button>
      <button class="btn-ghost" onclick="copyOut()">Copiar salida</button>
    </div>
    <p id="err" class="text-red-400 text-sm mt-3 hidden"></p>
    <p id="meta" class="text-xs mt-2" style="color:#5a5a6e"></p>
  </div>

  <div class="card p-6">
    <label class="text-xs font-semibold mb-2 block" style="color:#8b8b9e">Salida protegida</label>
    <textarea id="out" readonly placeholder="-- Protect by QyrexObf"></textarea>
  </div>

  <div class="mt-8 text-xs" style="color:#5a5a6e">
    API: <code class="text-purple-300">POST /api/obfuscate</code>
    body <code class="text-purple-300">{"code":"...","preset":"normal","antiTamper":true}</code>
  </div>
</div>
<script>
async function run(){
  const btn = document.getElementById('go');
  const err = document.getElementById('err');
  err.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Ofuscando...';
  try {
    const r = await fetch('/api/obfuscate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        code: document.getElementById('src').value,
        preset: document.getElementById('preset').value,
        antiTamper: document.getElementById('anti').checked
      })
    });
    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || 'Error');
    document.getElementById('out').value = d.code;
    document.getElementById('meta').textContent = d.bytesIn + ' → ' + d.bytesOut + ' bytes · ' + d.preset;
  } catch(e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Ofuscar';
  }
}
function copyOut(){
  const t = document.getElementById('out').value;
  if (t) navigator.clipboard.writeText(t);
}
</script>
</body>
</html>
