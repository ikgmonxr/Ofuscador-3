<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ofuscador Test</title>
    <style>
        body { font-family: monospace; background: #121212; color: #fff; padding: 20px; }
        textarea { width: 100%; height: 180px; background: #1e1e1e; color: #00ff66; border: 1px solid #333; }
        button { padding: 10px 20px; background: #0088ff; color: #fff; border: none; cursor: pointer; margin: 10px 0; }
    </style>
</head>
<body>

    <h2>Entrada de Script</h2>
    <textarea id="inputCode">
local msg = "Hola mundo"
print(msg)
    </textarea>

    <br>
    <button onclick="processScript()">Ofuscar Script</button>

    <h2>Resultado Ofuscado</h2>
    <textarea id="outputCode" readonly placeholder="Aquí aparecerá el código..."></textarea>

    <script>
        async function processScript() {
            const code = document.getElementById("inputCode").value;
            const outputArea = document.getElementById("outputCode");

            outputArea.value = "Procesando...";

            try {
                const response = await fetch("/api/obfuscate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code: code, level: 2 })
                });

                const data = await response.json();

                if (data.success) {
                    // Inyecta el resultado ofuscado en la caja de texto
                    outputArea.value = data.code;
                } else {
                    outputArea.value = "Error: " + (data.error || "Desconocido");
                }
            } catch (err) {
                outputArea.value = "Error de conexión: " + err.message;
            }
        }
    </script>
</body>
</html>
