<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploit Obfuscator</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0a0e27;
  color: #e0e0e0;
  font-family: 'Courier New', monospace;
  padding: 20px;
}
.container {
  max-width: 1400px;
  margin: 0 auto;
}
h1 {
  color: #00d4ff;
  text-align: center;
  margin: 0 0 30px 0;
}
.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  justify-content: center;
}
select {
  padding: 8px 12px;
  background: #1a1f3a;
  color: #00d4ff;
  border: 1px solid #00d4ff;
  border-radius: 4px;
  font-family: 'Courier New', monospace;
  cursor: pointer;
}
button {
  padding: 8px 20px;
  background: #00d4ff;
  color: #0a0e27;
  border: none;
  border-radius: 4px;
  font-weight: bold;
  cursor: pointer;
  font-family: 'Courier New', monospace;
}
button:hover {
  background: #00e5ff;
}
button:disabled {
  background: #666;
  cursor: wait;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}
.panel {
  border: 1px solid #00d4ff;
  border-radius: 4px;
  padding: 15px;
  background: #0f1426;
}
.panel h2 {
  margin: 0 0 10px 0;
  color: #00d4ff;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 2px;
}
textarea {
  width: 100%;
  height: 400px;
  background: #0a0e27;
  color: #00ff00;
  border: 1px solid #00d4ff;
  border-radius: 4px;
  padding: 10px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  resize: vertical;
}
textarea::placeholder {
  color: #555;
}
.info {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  font-size: 12px;
  color: #888;
}
.copy-btn {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
}
.status {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: #888;
}
.status.success {
  color: #00ff00;
}
.status.error {
  color: #ff4444;
}
.quick-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 20px;
  flex-wrap: wrap;
}
.quick-buttons button {
  padding: 6px 12px;
  font-size: 12px;
}
.warning {
  background: #3a2a1a;
  border-left: 3px solid #ffaa00;
  padding: 10px 15px;
  margin-bottom: 20px;
  border-radius: 4px;
  color: #ffaa00;
  font-size: 12px;
  line-height: 1.5;
}
@media (max-width: 900px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="container">
  <h1>⚡ EXPLOIT OBFUSCATOR</h1>
  
  <div class="warning">
    ⚠️ Obfuscador para exploit scripts de Roblox. Soporta scripts hasta 5MB. NO usa load/loadstring.
  </div>

  <div class="controls">
    <select id="level">
      <option value="1">LEVEL 1 - Basic (Variables)</option>
      <option value="2" selected>LEVEL 2 - Aggressive (Variables + Strings + Noise)</option>
    </select>
    <button onclick="obfuscate()">OBFUSCATE</button>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Input Script</h2>
      <textarea id="input" placeholder="Pega tu exploit script aquí..."></textarea>
      <div class="info">
        <span id="inputSize">0 bytes</span>
        <button class="quick-buttons" style="width: auto; margin-top: 0;" onclick="document.getElementById('input').value=''">Clear</button>
      </div>
    </div>

    <div class="panel">
      <h2>Obfuscated Output</h2>
      <textarea id="output" readonly placeholder="El script ofuscado aparecerá aquí..."></textarea>
      <div class="info">
        <span id="outputSize">0 bytes</span>
      </div>
      <button class="copy-btn" onclick="copyOutput()">📋 COPY OUTPUT</button>
    </div>
  </div>

  <div class="status" id="status">Ready</div>

  <div class="quick-buttons">
    <button onclick="loadExample()">📄 Load Example</button>
    <button onclick="clearAll()">🗑️ Clear All</button>
  </div>
</div>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const inputSize = document.getElementById('inputSize');
const outputSize = document.getElementById('outputSize');
const status = document.getElementById('status');

input.addEventListener('input', () => {
  inputSize.textContent = (input.value.length / 1024).toFixed(2) + ' KB';
});

function obfuscate() {
  if (!input.value.trim()) {
    status.textContent = 'Error: Paste a script first';
    status.className = 'status error';
    return;
  }

  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Processing...';

  const level = document.getElementById('level').value;

  fetch('/api/obfuscate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      code: input.value,
      level: parseInt(level)
    })
  })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      output.value = data.code;
      outputSize.textContent = (data.outputSize / 1024).toFixed(2) + ' KB';
      status.textContent = `✓ Obfuscated (${data.inputSize} → ${data.outputSize} bytes)`;
      status.className = 'status success';
    } else {
      status.textContent = `Error: ${data.error}`;
      status.className = 'status error';
    }
  })
  .catch(e => {
    status.textContent = `Error: ${e.message}`;
    status.className = 'status error';
  })
  .finally(() => {
    btn.disabled = false;
    btn.textContent = 'OBFUSCATE';
  });
}

function copyOutput() {
  if (!output.value) {
    status.textContent = 'Nothing to copy';
    return;
  }
  navigator.clipboard.writeText(output.value).then(() => {
    status.textContent = '✓ Copied to clipboard';
    status.className = 'status success';
    setTimeout(() => {
      status.textContent = 'Ready';
      status.className = 'status';
    }, 2000);
  });
}

function clearAll() {
  input.value = '';
  output.value = '';
  inputSize.textContent = '0 bytes';
  outputSize.textContent = '0 bytes';
  status.textContent = 'Ready';
  status.className = 'status';
}

function loadExample() {
  input.value = `-- Example Exploit Script
local Players = game:GetService("Players")
local LocalPlayer = Players.LocalPlayer

function main()
  print("Script running")
  local character = LocalPlayer.Character
  if character then
    print("Character found:", character.Name)
  end
end

main()`;
  inputSize.textContent = (input.value.length / 1024).toFixed(2) + ' KB';
}
</script>

</body>
</html>
